[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "docer-downloader-cli"
version = "0.1.0"
description = "Paste a docer or scribd link, get the file. No browser extension needed."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.31"]

[project.scripts]
docer-dl = "docer_dl:main"

[tool.setuptools]
py-modules = ["docer_dl"]
